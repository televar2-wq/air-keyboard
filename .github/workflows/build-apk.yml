name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download hand-tracking model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      # Saves the log (and the APK when it worked) to the "build-output" branch,
      # so the result can be read without opening the Actions page.
      - name: Save build output
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log 2>/dev/null || echo "no log" > /tmp/out/build.log
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/AirKeys.apk
          fi
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b build-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirKeys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirKeys-apk
          path: android/AirKeys.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Air Keys build ${{ github.run_number }}
          files: android/AirKeys.apk
          make_latest: "true"
