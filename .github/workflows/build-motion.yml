name: Build Motion Puppet APK

on:
  push:
    branches: [main]
    paths:
      - "motion/**"
      - ".github/workflows/build-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-motion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download body-tracking model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/pose_landmarker_full.task \
              https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task \
            || curl -fsSL -o app/src/main/assets/pose_landmarker_full.task \
              https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
          ls -la app/src/main/assets/pose_landmarker_full.task > /tmp/model-info

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../motion-build.log

      - name: Save build output
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/out
          cp motion-build.log /tmp/out/build.log 2>/dev/null || echo "no log" > /tmp/out/build.log
          if [ -f motion/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp motion/app/build/outputs/apk/debug/app-debug.apk /tmp/out/MotionPuppet.apk
          fi
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/out/STATUS
          cat /tmp/model-info >> /tmp/out/STATUS 2>/dev/null || true
          cd /tmp/out
          git init -q -b motion-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Motion build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" motion-output

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MotionPuppet.apk

      # Separate release series; never marked "latest" so the Air Keys link keeps working.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: motion-build-${{ github.run_number }}
          name: Motion Puppet build ${{ github.run_number }}
          files: motion/MotionPuppet.apk
          make_latest: "false"
